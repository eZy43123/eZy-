<!DOCTYPE html>

<body>

  <h1>Ali Saad Jasim</h1>

        </defs>
        <path d="M16 6h32v14c0 10-7 18-16 18S16 30 16 20z" fill="url(#p1)"/>
        <path d="M16 11H8c0 9 4 15 11 17M48 11h8c0 9-4 15-11 17" fill="none" stroke="url(#p1)" stroke-width="4" stroke-linecap="round"/>
        <path d="M22 11v9c0 6 3 11 7 13" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="2.5" stroke-linecap="round"/>
        <rect x="29" y="37" width="6" height="12" fill="url(#p1)"/>
        <rect x="19" y="49" width="26" height="4" rx="2" fill="url(#p1)"/>
        <rect x="15" y="53" width="34" height="6" rx="3" fill="url(#p1)"/>
